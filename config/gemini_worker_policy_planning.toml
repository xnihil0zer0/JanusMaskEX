# JanusMask planning-mode policy for Gemini CLI (post-hooks migration)
# Loaded via: gemini --admin-policy config/gemini_worker_policy_planning.toml
#
# Same allow-native backbone as synthesis plus:
#   - generalist + codebase_investigator sub-agents allowed
#   - per-subagent read-only carve-outs (sub-plan 03 §3.4 row L)

# -- Allow native tools --

[[rule]]
toolName = "write_file"
decision = "allow"
priority = 999

[[rule]]
toolName = "replace"
decision = "allow"
priority = 999

[[rule]]
toolName = "read_file"
decision = "allow"
priority = 999

[[rule]]
toolName = "read_many_files"
decision = "allow"
priority = 999

[[rule]]
toolName = "glob"
decision = "allow"
priority = 999

[[rule]]
toolName = "grep_search"
decision = "allow"
priority = 999

[[rule]]
toolName = "list_directory"
decision = "allow"
priority = 999

[[rule]]
toolName = "run_shell_command"
decision = "allow"
priority = 999

# -- Hard denies (hooks cannot re-enable these) --

[[rule]]
toolName = "google_web_search"
decision = "deny"
denyMessage = "JanusMask worker: web search denied."
priority = 999

[[rule]]
toolName = "web_fetch"
decision = "deny"
denyMessage = "JanusMask worker: web fetch denied."
priority = 999

[[rule]]
toolName = "write_todos"
decision = "deny"
denyMessage = "JanusMask worker: todos denied."
priority = 999

[[rule]]
toolName = "save_memory"
decision = "deny"
denyMessage = "JanusMask worker: save_memory denied."
priority = 999

[[rule]]
toolName = "cli_help"
decision = "deny"
denyMessage = "JanusMask worker: cli_help is for the Gemini CLI wrapper, NOT JanusMask."
priority = 999

# -- Planning-only sub-agents --

[[rule]]
toolName = "generalist"
decision = "allow"
priority = 999

[[rule]]
toolName = "codebase_investigator"
decision = "allow"
priority = 999

# -- Sub-agent read-only carve-outs --

[[rule]]
subagent = "generalist"
toolName = "read_file"
decision = "allow"
priority = 999

[[rule]]
subagent = "generalist"
toolName = "list_directory"
decision = "allow"
priority = 999

[[rule]]
subagent = "generalist"
toolName = "grep_search"
decision = "allow"
priority = 999

[[rule]]
subagent = "generalist"
toolName = "glob"
decision = "allow"
priority = 999

[[rule]]
subagent = "codebase_investigator"
toolName = "read_file"
decision = "allow"
priority = 999

[[rule]]
subagent = "codebase_investigator"
toolName = "list_directory"
decision = "allow"
priority = 999

[[rule]]
subagent = "codebase_investigator"
toolName = "grep_search"
decision = "allow"
priority = 999

[[rule]]
subagent = "codebase_investigator"
toolName = "glob"
decision = "allow"
priority = 999

# Block all MCP servers — no janusmask MCP server registered post-migration.
[[rule]]
mcpName = "*"
toolName = "*"
decision = "deny"
denyMessage = "JanusMask: no MCP servers in hook-mode."
priority = 900
