<div class="card" id="planner-panel">
    <h2>Interactive Brief Writer</h2>
    
    <!-- Brief Form -->
    <form id="briefForm" style="display: flex; flex-direction: column; gap: 1rem; width: 100%;">
        <div class="form-group">
            <label class="form-label" for="brief_name">Brief Slug / Name</label>
            <input class="form-input" type="text" id="brief_name" name="brief_name" value="lib_crypto_audit">
        </div>
        <div class="form-group">
            <label class="form-label" for="brief_content">Markdown Brief Content</label>
            <textarea class="form-textarea" id="brief_content" name="brief_content" rows="6" style="resize: vertical;"># Security Audit for cryptographic helper functions
- Target: lib/crypto.py
- Ruleset: no_unseeded_random, subprocess_no_check

## Tasks
- [ ] Inspect crypto seed generation
- [ ] Run AST validation checks
</textarea>
        </div>
        
        <div style="display: flex; gap: 0.75rem;">
            <button class="btn-secondary" style="flex: 1;" type="button" 
                    hx-post="/action/preview_plan" hx-target="#planPreview" hx-include="#briefForm">
                Preview Plan
            </button>
            <button class="btn-action" style="flex: 1;" type="button" 
                    hx-post="/action/submit_brief" hx-target="#briefResult" hx-include="#briefForm">
                Submit Brief
            </button>
        </div>
    </form>

    <div id="briefResult" style="font-size: 0.85rem;"></div>
    <div id="planPreview" style="font-size: 0.85rem;"></div>

    <div style="border-top: 1px solid var(--border-color); padding-top: 1rem; margin-top: 0.5rem;">
        <button class="btn-action" style="background: linear-gradient(135deg, var(--accent-green), #00b375); width: 100%;" 
                hx-post="/action/launch_run" hx-target="#launchResult">
            Launch Orchestrator Run
        </button>
        <div id="launchResult" style="font-size: 0.85rem; text-align: center; margin-top: 0.5rem;"></div>
    </div>
</div>
