agent_sandbox:
  bwrap: true
agents:
  antigravity:
    args:
    - -p
    - --dangerously-skip-permissions
    - --sandbox
    command: ${PROJECT_ROOT}/.agents/agy/agy
  claude:
    args:
    - -p
    - --model
    - opus
    - --output-format
    - stream-json
    # H6/claude-jail-fix: claude-code 2.1.156 REQUIRES --verbose for stream-json under
    # --print/-p (errors "stream-json requires --verbose" otherwise). The vendored claude
    # was updated past the version this config was written for; without it every jailed
    # claude spawn aborts before submitting. agy-backed agents (gemini/claude_fallback)
    # do not need it.
    - --verbose
    - --include-partial-messages
    - --settings
    - ${CONFIG_DIR}/claude_worker.json
    - --mcp-config
    - ${CONFIG_DIR}/claude_mcp.json
    - --strict-mcp-config
    - --setting-sources
    - ''
    - --tools
    - Read,Glob,Grep,Write
    - --disallowedTools
    - Bash,Edit,Task,NotebookEdit,WebFetch,WebSearch,Skill,ToolSearch
    command: ${PROJECT_ROOT}/.agents/claude-code/node_modules/.bin/claude
  claude_fallback:
    args:
    - -m
    - claude-opus-4.6
    - -p
    - --dangerously-skip-permissions
    - --sandbox
    command: ${PROJECT_ROOT}/.agents/agy/agy
  gemini:
    args:
    - -p
    # gemini-jail-fix (REV25 exec): agy must run with --dangerously-skip-permissions
    # like the antigravity/claude_fallback agents above. Without it, a current agy build
    # raises an interactive tool-permission prompt the moment the agent tries to Write its
    # submission; in the non-interactive bwrap jail that prompt cannot be answered and agy
    # dies "without submitting (code 2)", so the dual-agent gate can never pass. (claude
    # avoids this via --tools Read,Glob,Grep,Write; agy has no such allowlist flag.)
    - --dangerously-skip-permissions
    command: ${PROJECT_ROOT}/.agents/agy/agy
autowork:
  brief_max_age_seconds: 604800
  brief_max_size_bytes: 50000
  conservative_missing_files: true
  cooldown_tier_1: 100.0
  cooldown_tier_2: 1000.0
  cooldown_tier_3: 10000.0
  enabled: false
  heartbeat_sec: 1800
  min_ram_mb: 1024
  parallel_cap: 5
  planner_min_wall_sec: 10.0
  planner_timeout_sec: 1800
  poll_interval_sec: 5
batch_execution:
  batch_size_per_worker: 2000
  enabled: true
  rlimit_nproc: null
  seccomp: true
  wall_timeout_per_input_sec: 5.0
  worker_pool_size: 1
control:
  approval_timeout_sec: 1800
  autobrief_default_agent: claude
  autobrief_max_rough_draft_bytes: 16384
  autobrief_timeout_sec: 180
  decisions_dir: state/control/decisions
  pause_flag_path: state/control/orchestrator.flag
  require_approval: []
cross_examination:
  anonymize: true
  max_rounds: 1
  normalize_variables: true
  strip_comments: true
decomposition:
  fresh_instances: true
  max_depth: 2
  max_subtasks: 5
fuzzing:
  engine: hypothesis
  float_tolerance: 1.0e-09
  function_level_inputs: 2000
  program_level_inputs: 1000
  seed: 42
  timeout_per_input_ms: 5000
hooks:
  enforce_verbs: []
  mode: shadow
  shadow_dir: state/hooks/shadow/
  shadow_min_clean_runs: 3
sandbox:
  cpu_time_limit_seconds: 10
  filesystem_root: /tmp/janusmask_sandbox
  memory_limit_mb: 256
  network: false
synthesis:
  active_agents:
  - claude
  - gemini
  antigravity_mode: false
  clarification_timeout_sec: 60
  max_ast_retries: 3
  max_clarification_requests: 2
  # Synthesis window per agent per round. Widened 1200->1800 (2026-05-31): the
  # hardened A-TEST (read-first grounding mandate) makes claude's thorough
  # whole-file authoring take ~23min, which overran the old 1200s window and
  # tripped 'TimeoutError(1 of 2 futures unfinished)'. HARD budget = 2*window+slack
  # scales with this; fast tasks finish early (window is a ceiling, not a duration).
  timeout_seconds: 1800
  # H5: cap for the verification_command subprocess on BOTH the accept path
  # (_auto_commit_accepted) and the baseline precompute (_precompute_baseline_test_results).
  # Decoupled from timeout_seconds so the verify cap can be tuned independently;
  # if removed, the code floors timeout_seconds at 900s.
  verification_timeout_seconds: 1200
test_author:
  review_pass: true
